<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#7c3aed" />
  <title>Venture</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand small" href="index.html" aria-label="Venture home">
        <span class="brand-mark">V</span>
        <span>Venture</span>
      </a>
      <nav class="top-actions">
        <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">◐</button>
        <button id="settingsButton" class="icon-btn" aria-label="Open settings">⚙</button>
      </nav>
    </header>

    <main class="home-main">
      <section class="hero">
        <div class="brand hero-brand" aria-label="Venture">
          <span class="brand-mark large">V</span>
          <span>Venture</span>
        </div>
        <p class="tagline">Search the web. Keep it simple.</p>

        <form id="searchForm" class="search-box" role="search">
          <input id="searchInput" autocomplete="off" spellcheck="false" placeholder="Search the web" aria-label="Search the web" />
          <button type="submit" class="search-btn" aria-label="Search">→</button>
        </form>

        <div id="suggestions" class="suggestions" hidden></div>

        <div class="quick-links" aria-label="Quick links">
          <a href="https://wikipedia.org">Wikipedia</a>
          <a href="https://youtube.com">YouTube</a>
          <a href="https://github.com">GitHub</a>
          <a href="https://reddit.com">Reddit</a>
        </div>
      </section>

      <section class="privacy-card">
        <div class="privacy-icon">✦</div>
        <div>
          <h2>Search without the clutter.</h2>
          <p>Venture keeps the interface lightweight and sends your searches to the provider you choose.</p>
        </div>
      </section>
    </main>

    <footer>
      <span>Venture</span>
      <span class="footer-dot">•</span>
      <a href="#" id="footerSettings">Settings</a>
    </footer>
  </div>

  <dialog id="settingsDialog" class="settings-dialog">
    <form method="dialog">
      <div class="dialog-header">
        <h2>Settings</h2>
        <button class="icon-btn" value="cancel" aria-label="Close">×</button>
      </div>

      <label class="setting-row">
        <span>
          <strong>Search provider</strong>
          <small>Choose where Venture sends searches.</small>
        </span>
        <select id="providerSelect">
          <option value="duckduckgo">DuckDuckGo</option>
          <option value="google">Google</option>
          <option value="bing">Bing</option>
          <option value="brave">Brave Search</option>
        </select>
      </label>

      <label class="setting-row">
        <span>
          <strong>Open results in new tab</strong>
          <small>Keep Venture open while you search.</small>
        </span>
        <input id="newTabToggle" type="checkbox" />
      </label>

      <button class="primary-btn" value="default">Done</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
