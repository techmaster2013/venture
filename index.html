<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Venture</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page-shell">
  <header class="topbar">
    <div class="top-spacer"></div>
    <nav class="top-actions">
      <a href="dashboard.html" class="top-link">Crawler</a>
      <span id="indexBadge" class="index-badge" title="Venture crawler index"><i></i><span>offline</span></span>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">◐</button>
      <button id="settingsButton" class="icon-btn" aria-label="Settings">⚙</button>
    </nav>
  </header>

  <main id="homeView" class="home-main">
    <section class="hero">
      <a class="wordmark home-wordmark" href="index.html" aria-label="Venture home"><span>V</span>enture</a>
      <form id="searchForm" class="search-box" role="search">
        <span class="search-icon">⌕</span>
        <input id="searchInput" autocomplete="off" spellcheck="false" aria-label="Search" placeholder="Search Venture or type a URL">
        <button type="submit" class="search-btn">Search</button>
      </form>
      <div class="home-buttons">
        <button type="button" onclick="document.getElementById('searchForm').requestSubmit()">Venture Search</button>
        <a href="dashboard.html">Crawler Status</a>
      </div>
      <p class="home-status"><span id="homeIndexCount">Crawler offline</span><span id="homeIndexDetail"></span></p>
    </section>
  </main>

  <main id="resultsView" class="results-view" hidden>
    <header class="results-head">
      <a class="wordmark results-wordmark" href="index.html"><span>V</span>enture</a>
      <form id="resultsForm" class="search-box results-search" role="search">
        <input id="resultsInput" autocomplete="off" spellcheck="false" aria-label="Search">
        <button type="submit" class="round-search" aria-label="Search">⌕</button>
      </form>
      <div class="results-actions">
        <button id="resultsThemeToggle" class="icon-btn" aria-label="Toggle theme">◐</button>
      </div>
    </header>
    <nav class="result-tabs">
      <button class="active">All</button>
      <button disabled>Images</button>
      <button disabled>News</button>
    </nav>
    <div class="results-body">
      <p id="resultStatus" class="result-status"></p>
      <div id="resultsList" class="results-list"></div>
      <div id="resultError" class="result-error" hidden>
        <p>Venture couldn't find anything for that search yet.</p>
        <a id="fallbackLink" target="_blank" rel="noopener noreferrer">Try DuckDuckGo</a>
      </div>
    </div>
  </main>

  <footer>
    <span>Venture</span>
    <div><a href="dashboard.html">Crawler</a><a href="#" id="footerSettings">Settings</a></div>
  </footer>
</div>

<dialog id="settingsDialog" class="settings-dialog">
  <form method="dialog">
    <div class="dialog-header"><h2>Search settings</h2><button class="icon-btn" value="cancel" aria-label="Close">×</button></div>
    <div class="setting-row"><span><strong>Search engine</strong><small>VentureBot index with temporary fallback results.</small></span><strong>Venture v2</strong></div>
    <label class="setting-row"><span><strong>Open results in new tab</strong><small>Keep Venture open when you visit a result.</small></span><input id="newTabToggle" type="checkbox"></label>
    <button class="primary-btn" value="default">Done</button>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
